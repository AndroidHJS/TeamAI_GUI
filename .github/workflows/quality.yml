name: Quality

on:
  push:
    branches:
      - main
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm audit --omit=dev --audit-level=high
      - name: Diff and secret checks
        shell: bash
        run: |
          git diff --check
          if git grep -nE '(BEGIN (RSA|OPENSSH) PRIVATE KE[Y]|correct horse battery stapl[e])' -- ':!e2e/fixtures/**' ':!e2e/app.spec.ts'; then
            echo "Sensitive test material found outside approved test sources"
            exit 1
          fi
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test installed package
        run: npm run smoke:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teamai-sync-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            test-results/
            .e2e-user-data/e2e.log
          if-no-files-found: ignore
